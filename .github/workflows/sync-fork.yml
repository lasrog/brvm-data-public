name: Sync fork with upstream

on:
  schedule:
    # Toutes les 30 min, du lundi au vendredi, 9h-15h UTC (heures de trading BRVM)
    - cron: '*/30 9-15 * * 1-5'
  workflow_dispatch: {}   # permet de le lancer manuellement

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ton fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer l'identité git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Créer une branche de sauvegarde (1x/jour max)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BACKUP_BRANCH="backup/$TODAY"
          if git ls-remote --exit-code --heads origin "$BACKUP_BRANCH" >/dev/null 2>&1; then
            echo "Backup du jour ($BACKUP_BRANCH) déjà existante, on saute."
          else
            git checkout -b "$BACKUP_BRANCH"
            git push origin "$BACKUP_BRANCH"
            git checkout main
          fi

      - name: Ajouter l'upstream et fusionner
        run: |
          git remote add upstream https://github.com/Fredysessie/brvm-data-public.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-ff -m "Sync data from upstream $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Pousser les changements
        run: git push origin main
