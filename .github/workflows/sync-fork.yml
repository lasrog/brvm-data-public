Récapitulatif de ce qui a changé par rapport à ta version :

--ff-only → --no-ff : accepte que ton main et l'upstream aient chacun des commits propres (ton workflow d'un côté, les nouvelles données de l'autre), et crée un commit de fusion au lieu d'exiger un historique strictement linéaire.
Ajout de l'identité git (user.name/user.email) avant le merge, nécessaire pour que le commit de fusion ait un auteur valide dans l'environnement du runner.
Sauvegarde quotidienne conservée (une branche backup/AAAA-MM-JJ par jour max, créée avant le sync).
Remplace le contenu de ton .github/workflows/sync-fork.yml sur GitHub par celui-ci, puis relance manuellement (Run workflow) pour vérifier que ça passe.


