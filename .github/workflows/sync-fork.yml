name: Sync fork with upstream

on:
  schedule:
    - cron: '*/30 9-15 * * 1-5'   # sync toutes les 30 min, heures de trading
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ton fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer une branche de sauvegarde (1x/jour max)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BACKUP_BRANCH="backup/$TODAY"
          if git ls-remote --exit-code --heads origin "$BACKUP_BRANCH" >/dev/null 2>&1; then
            echo "Backup du jour ($BACKUP_BRANCH) déjà existante, on saute."
          else
            git checkout -b "$BACKUP_BRANCH"
            git push origin "$BACKUP_BRANCH"
            git checkout main
          fi

      - name: Ajouter l'upstream et fusionner
        run: |
          git remote add upstream https://github.com/Fredysessie/brvm-data-public.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --ff-only

      - name: Pousser les changements
        run: git push origin main
