les branches qui sont écrées comme backup ne font ils pas excécuter le fichier sync-fork.yml et on risque avoir une boucle infinie?


A réfléchi pendant 5 s
A réfléchi pendant 5 s
Bonne question, mais non — pas de risque de boucle ici. Voici pourquoi :

Le déclencheur du workflow est défini par le bloc on: en haut du fichier :

yaml
on:
  schedule:
    - cron: '*/30 9-15 * * 1-5'
  workflow_dispatch: {}
Il n'y a pas de on: push. Donc peu importe combien de branches tu crées ou de commits tu pousses (git push origin backup/..., git push origin main), ça ne déclenche jamais une nouvelle exécution du workflow. Seul le cron (toutes les 30 min) ou un déclenchement manuel (workflow_dispatch) lance le job.

Une boucle infinie arriverait seulement si le workflow avait un trigger du type :

yaml
on:
  push:
    branches: ['**']   # ou même juste 'main'
— dans ce cas-là, oui, chaque push (y compris ceux faits par le workflow lui-même) relancerait le job, qui repousserait, qui relancerait, etc. Mais ce n'est pas ta configuration actuelle, donc tu es tranquille.

Si un jour tu ajoutes un trigger on: push pour une autre raison, la parade classique est soit d'exclure les commits faits par le bot (if: github.actor != 'github-actions[bot]'), soit d'utiliser [skip ci] dans le message de commit.


Message réduit

A réfléchi pendant 14 s
A réfléchi pendant 14 s
La cause : ton main a maintenant divergé de upstream/main. Dès que tu as ajouté le fichier .github/workflows/sync-fork.yml en committant directement sur main de ton fork, ton main a un commit que l'upstream n'a pas — et de son côté, l'upstream a continué d'avancer avec ses propres nouvelles données. Les deux branches ont donc chacune des commits que l'autre n'a pas : ce n'est plus une simple avance linéaire, donc --ff-only refuse (à raison) de fusionner.

C'est en fait permanent avec --ff-only : dès qu'un fork a ne serait-ce qu'un seul commit propre (ton fichier de workflow), le fast-forward pur devient impossible pour toujours, puisque ton historique et celui de l'upstream ne seront plus jamais strictement linéaires l'un par rapport à l'autre.

La solution : remplacer le fast-forward strict par un vrai merge (qui crée un commit de fusion). Comme tes seuls commits propres touchent .github/workflows/ et que l'upstream ne touche que data/, il n'y aura pas de conflit réel :

yaml
      - name: Ajouter l'upstream et fusionner
        run: |
          git remote add upstream https://github.com/Fredysessie/brvm-data-public.git
          git fetch upstream main
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-ff -m "Sync data from upstream $(date -u +%Y-%m-%dT%H:%M:%SZ)"
Remplace juste ton étape "Ajouter l'upstream et fusionner" par celle-ci (--ff-only devient --no-ff + un message de commit, et j'ajoute la config git user/email nécessaire pour que le commit de merge ait un auteur valide).

Si jamais un vrai conflit apparaît un jour (peu probable vu que vous ne touchez pas les mêmes fichiers), le job échouera avec un message de conflit explicite plutôt que ce message de fast-forward — tu pourras me montrer l'erreur et on ajustera.

